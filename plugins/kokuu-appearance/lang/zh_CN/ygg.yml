# ============================================================================
#  Yggdrasil API「启动器配置」卡片文案（kokuu-ui 视图覆盖版）
# ----------------------------------------------------------------------------
#  这些键只服务于 kokuu-ui/views/ygg/dnd.twig —— 那个视图通过
#  replaceNamespace() 顶替了 yggdrasil-api 自带的 Yggdrasil::dnd。
#
#  文案原则：**极简**。这张卡只有一个动作（把按钮拖进启动器），
#  所以只需要几块：这是什么、地址是哪、拖哪去、能不能用。
#  早期版本写了三步清单 + 说明段落，实测是冗余的 —— 按钮本身就是说明书。
#
#  ⚠️ 启动器名（HMCL / PCL）**不翻译**，直接硬编码在 twig 里 ——
#     它们是产品专有名词，翻译成「欢乐模拟器」反而让用户搜不到。
#     所以 noteLabel 只给「支持」这个前缀。
#     （原为「仅支持」，2026-10-04 改：卡片同时列出了 HMCL 和 PCL 两个
#      徽章，前缀再说「仅」显得自相矛盾 —— 读起来像在否定自己列的东西。）
# ============================================================================

